<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-180.png" />
<link rel="icon" href="favicon.ico" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Mi jornada" />
<meta name="theme-color" content="#7c3aed" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>I - Mi jornada</title>
<script src="lib/lucide.min.js"></script>
<script src="lib/chart.umd.js"></script>
<style>
:root{--bg:#f6f5fb;--card:#fff;--ink:#1e1b2e;--mut:#8b88a0;--line:#ece9f6;--pri:#7c3aed;--pri2:#a78bfa;--soft:#f1ecff;--ok:#16a34a;--okbg:#dcfce7;--warn:#ea580c;--warnbg:#ffedd5;--off:#eef0f5;--sh:0 2px 12px rgba(76,29,149,.07)}
.dark{--bg:#0f172a;--card:#1e293b;--ink:#e2e8f0;--mut:#94a3b8;--line:#334155;--soft:#2b2250;--okbg:#064e3b;--warnbg:#7c2d12;--off:#273449;--sh:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;touch-action:manipulation;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
button,input,select{font:inherit;color:inherit}button{border:0;background:none;cursor:pointer}
.hidden{display:none!important}.wrap{max-width:30rem;margin:0 auto;padding:0 16px}
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(12px + env(safe-area-inset-top)) 0 8px}
.top .wrap{display:flex;align-items:center;justify-content:space-between}
h1{margin:0;font-size:1.35rem;font-weight:800;letter-spacing:-.02em}
.ib{width:40px;height:40px;border-radius:14px;background:var(--card);box-shadow:var(--sh);display:inline-flex;align-items:center;justify-content:center;margin-left:8px;color:var(--mut)}
.ib svg{width:19px;height:19px}
.hero{margin-top:8px;border-radius:24px;padding:20px;color:#fff;background:linear-gradient(135deg,#7c3aed,#a855f7 60%,#c084fc);box-shadow:0 10px 28px rgba(124,58,237,.3);display:flex;gap:16px}
.hero div{flex:1}.hero small{display:block;opacity:.8;font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.hero b{font-size:1.9rem;font-weight:800;letter-spacing:-.02em}.hero .sep{flex:0 0 1px;background:rgba(255,255,255,.25)}
.day h4{margin:20px 4px 8px;font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.card{background:var(--card);border-radius:20px;box-shadow:var(--sh);border:1.5px solid transparent;padding:14px}
.card.sel{border-color:var(--pri)}.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}.grow{flex:1;min-width:0}
.e{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.big{font-weight:800;font-size:1.05rem}.mut{color:var(--mut);font-size:.78rem}.amt{font-weight:800;color:var(--pri);font-size:1.05rem}
.dark .amt{color:var(--pri2)}
.pill{display:inline-block;font-size:.65rem;font-weight:800;letter-spacing:.04em;padding:2px 8px;border-radius:99px;text-transform:uppercase}
.pill.p{background:var(--warnbg);color:var(--warn)}.pill.c{background:var(--okbg);color:var(--ok)}
.loc{display:inline-flex;align-items:center;gap:3px;color:var(--mut);font-size:.72rem;margin-top:2px}.loc svg{width:11px;height:11px}
.tm{font-size:.68rem;font-weight:700;background:var(--soft);color:var(--pri);padding:1px 7px;border-radius:8px;margin-left:6px;vertical-align:middle}
.dark .tm{color:var(--pri2)}
.off{background:var(--off);box-shadow:none;border:1.5px dashed var(--line)}
.sm{padding:8px;border-radius:12px;color:var(--mut)}.sm svg{width:16px;height:16px}.sm.pay{background:var(--soft);color:var(--pri)}.sm.del{color:#f87171}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding:6px 12px calc(6px + env(safe-area-inset-bottom))}
.tabbar .wrap{display:flex;padding:0}.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px;font-size:.68rem;font-weight:700;color:var(--mut)}
.tab svg{width:22px;height:22px}.tab.on{color:var(--pri)}.dark .tab.on{color:var(--pri2)}
.fab{position:fixed;right:max(18px,calc(50% - 15rem + 18px));bottom:calc(84px + env(safe-area-inset-bottom));z-index:25;width:58px;height:58px;border-radius:20px;background:var(--pri);color:#fff;box-shadow:0 8px 22px rgba(124,58,237,.45);display:flex;align-items:center;justify-content:center}
.fab svg{width:26px;height:26px}
.bulk{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));z-index:35;background:#1e1b2e;color:#fff;border-radius:99px;padding:8px 8px 8px 18px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.35);font-size:.8rem;font-weight:700;white-space:nowrap}
.bulk button{padding:9px 14px;border-radius:99px;font-size:.7rem;font-weight:800;color:#fff}
.ov{position:fixed;inset:0;z-index:50;background:rgba(15,10,35,.6);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center}
.ov.mid{align-items:center;padding:20px}
.sheet{background:var(--card);width:100%;max-width:30rem;border-radius:28px 28px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;animation:up .22s ease-out}
.mid .sheet{border-radius:28px;max-width:22rem;padding:22px}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h3{margin:0 0 14px;font-size:1.1rem}
.seg{display:flex;background:var(--bg);border-radius:14px;padding:4px;margin-bottom:12px}
.seg button{flex:1;padding:9px;border-radius:11px;font-size:.78rem;font-weight:800;color:var(--mut)}
.seg button.on{background:var(--card);color:var(--pri);box-shadow:var(--sh)}
.dark .seg button.on{background:#334155;color:var(--pri2)}
input,select{width:100%;background:var(--bg);border:1.5px solid transparent;border-radius:14px;padding:12px 14px;outline:0;margin-bottom:10px;min-width:0}
input:focus{border-color:var(--pri)}.two{display:flex;gap:10px}.two>*{flex:1}
label.l{display:block;font-size:.68rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:2px 4px 5px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{padding:9px 13px;border-radius:99px;background:var(--bg);font-weight:700;font-size:.85rem;border:1.5px solid transparent}
.chip.on{background:var(--soft);border-color:var(--pri);color:var(--pri)}.dark .chip.on{color:var(--pri2)}
.btn{width:100%;padding:14px;border-radius:16px;background:var(--pri);color:#fff;font-weight:800;box-shadow:0 6px 16px rgba(124,58,237,.3)}
.btn.b{background:#2563eb;box-shadow:none}.btn.g{background:#16a34a;box-shadow:none}.btn.s{background:var(--soft);color:var(--pri);box-shadow:none}
.link{color:var(--mut);font-size:.8rem;font-weight:700;padding:8px;width:100%}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.cal .w{text-align:center;font-size:.65rem;font-weight:800;color:var(--mut)}
.cd{aspect-ratio:.9;border-radius:12px;background:var(--bg);display:flex;flex-direction:column;align-items:center;padding-top:5px;font-size:.8rem;font-weight:700}
.cd small{font-size:.6rem;font-weight:800}.cd.p{background:var(--warnbg);color:var(--warn)}.cd.c{background:var(--okbg);color:var(--ok)}.cd.o{background:var(--off);color:var(--mut)}
.cd.today{outline:2px solid var(--pri)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.g2 .big{font-size:1.5rem;display:block}
.cr{display:flex;gap:8px;align-items:center;margin-bottom:8px}.cr input{margin:0}.cr .em{width:56px;text-align:center;flex:none}
.hd{display:flex;align-items:center;justify-content:space-between;margin:14px 0 10px}.hd h2{margin:0;font-size:1.05rem;text-transform:capitalize}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
canvas{max-height:220px}
</style>
</head>
<body>
<div class="top"><div class="wrap"><h1>Mi jornada</h1><div>
<button class="ib" onclick="openCats()" aria-label="Categorías"><i data-lucide="tags"></i></button>
<button class="ib" onclick="toggleDarkMode()" aria-label="Tema"><i id="theme-icon" data-lucide="moon"></i></button></div></div></div>
<main class="wrap">
<section id="v-list">
 <div class="hero"><div><small>Pendiente</small><b id="moneyPending">0€</b></div><span class="sep"></span><div><small>Cobrado</small><b id="moneyPaid">0€</b></div></div>
 <div id="hist"></div>
</section>
<section id="v-cal" class="hidden">
 <div class="hd"><button class="ib" onclick="changeMonth(-1)"><i data-lucide="chevron-left"></i></button><h2 id="monthLabel"></h2><button class="ib" onclick="changeMonth(1)"><i data-lucide="chevron-right"></i></button></div>
 <div class="card"><div class="cal" style="margin-bottom:6px"><div class="w">L</div><div class="w">M</div><div class="w">X</div><div class="w">J</div><div class="w">V</div><div class="w">S</div><div class="w">D</div></div><div id="calDays" class="cal"></div></div>
</section>
<section id="v-sum" class="hidden">
 <div class="two" style="margin-top:12px"><button class="btn b" id="export-btn">Exportar</button><button class="btn g" id="import-btn">Cargar</button></div>
 <input type="file" id="import-input" accept=".json" class="hidden" style="display:none" />
 <div class="hd"><button class="ib" onclick="changeSummaryMonth(-1)"><i data-lucide="chevron-left"></i></button><h2 id="sumLabel"></h2><button class="ib" onclick="changeSummaryMonth(1)"><i data-lucide="chevron-right"></i></button></div>
 <div class="g2">
  <div class="card"><span class="mut">Días trabajados</span><b class="big" id="s-days" style="color:var(--pri)">0</b></div>
  <div class="card"><span class="mut">Días libres</span><b class="big" id="s-off">0</b></div>
  <div class="card"><span class="mut">Horas</span><b class="big" id="s-hours">0h</b></div>
  <div class="card"><span class="mut">Total generado</span><b class="big" id="s-total" style="color:var(--ok)">0€</b></div>
 </div>
 <div class="card" style="margin-bottom:10px"><b>Descansos</b><div id="s-reasons" class="mut" style="margin-top:6px">—</div></div>
 <div class="card" style="margin-bottom:10px"><b>Cobros</b><div class="mut" style="margin-top:6px">💵 Efectivo: <span id="s-cash">0€</span><br>🏦 Banco: <span id="s-bank">0€</span><br>⏳ Pendiente: <span id="s-pend">0€</span></div></div>
 <div class="card" style="margin-bottom:10px"><b>Dinero</b><canvas id="moneyChart"></canvas></div>
 <div class="card"><b>Métodos de cobro</b><canvas id="methodChart"></canvas></div>
</section>
</main>
<button id="fab" class="fab" onclick="openSheet()" aria-label="Nuevo registro"><i data-lucide="plus"></i></button>
<div id="bulk" class="bulk hidden"><span id="bulk-text"></span><button style="background:#2563eb" onclick="markBulkPaid('transfer')">BANCO</button><button style="background:#16a34a" onclick="markBulkPaid('cash')">EFECTIVO</button></div>
<nav class="tabbar"><div class="wrap">
<button class="tab on" id="t-list" onclick="switchTab('list')"><i data-lucide="list"></i>Registro</button>
<button class="tab" id="t-cal" onclick="switchTab('cal')"><i data-lucide="calendar-days"></i>Calendario</button>
<button class="tab" id="t-sum" onclick="switchTab('sum')"><i data-lucide="chart-pie"></i>Resumen</button></div></nav>

<div id="sheet" class="ov hidden" onclick="if(event.target===this)closeSheet()"><div class="sheet">
 <h3 id="sheet-title">Nuevo registro</h3>
 <div class="seg"><button id="m-work" class="on" onclick="setFormMode('work')">TRABAJO</button><button id="m-off" onclick="setFormMode('off')">DESCANSO</button></div>
 <label class="l">Fecha</label><input type="date" id="dateInput" />
 <div id="f-work">
  <div class="seg"><button id="tm-total" class="on" onclick="setTime('total')">Horas totales</button><button id="tm-range" onclick="setTime('range')">Horario</button></div>
  <input type="number" id="hoursInput" placeholder="Horas (ej. 7.5)" step="0.5" inputmode="decimal" />
  <div id="f-range" class="hidden"><div class="two"><input type="time" id="startTime" onchange="calcHours()" /><input type="time" id="endTime" onchange="calcHours()" /></div><div class="mut" style="text-align:center;margin:-2px 0 10px" id="calc">0.00 horas</div></div>
  <div class="two"><div><label class="l">Precio/hora</label><input type="number" id="rateInput" value="10" inputmode="decimal" /></div><div style="flex:1.6"><label class="l">Ubicación (opcional)</label><input type="text" id="locationInput" list="locs" placeholder="📍 Dónde" /></div></div>
  <datalist id="locs"></datalist>
 </div>
 <div id="f-off" class="hidden"><label class="l">Motivo</label><div id="chips" class="chips"></div><button class="link" onclick="openCats()">Gestionar categorías</button></div>
 <button class="btn" id="save-btn" onclick="addEntry()">Guardar registro</button>
 <button class="link" onclick="closeSheet()">Cancelar</button>
</div></div>

<div id="cats" class="ov mid hidden" onclick="if(event.target===this)closeCats()"><div class="sheet">
 <h3>Categorías de descanso</h3><div id="cat-list"></div>
 <label class="l" style="margin-top:12px">Nueva categoría</label>
 <div class="cr"><input class="em" id="newEmoji" placeholder="🙂" maxlength="4" /><input id="newName" placeholder="Nombre" /></div>
 <button class="btn s" onclick="addCat()">Añadir</button><button class="link" onclick="closeCats()">Cerrar</button>
</div></div>

<div id="pay" class="ov mid hidden" onclick="if(event.target===this)closePay()"><div class="sheet">
 <h3 style="text-align:center">Marcar como cobrado</h3>
 <div class="two"><button class="btn b" onclick="confirmPayment('transfer')">Banco 🏦</button><button class="btn g" onclick="confirmPayment('cash')">Mano 💵</button></div>
 <button class="link" onclick="closePay()">Cancelar</button>
</div></div>

<div id="day" class="ov mid hidden" onclick="if(event.target===this)closeDay()"><div class="sheet">
 <h3 id="day-title" style="text-transform:capitalize"></h3><div id="day-content"></div>
 <button class="btn s" onclick="newFromDay()">Nuevo registro este día</button><button class="link" onclick="closeDay()">Cerrar</button>
</div></div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const load=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v??d}catch{return d}};
const DEF_CATS=[["Descanso","😴"],["Festivo","🎉"],["Lluvia","🌧️"],["Enfermedad","🤒"],["Vacaciones","🏖️"],["Permiso","📝"],["Cita médica","🩺"]].map(([name,emoji])=>({name,emoji}));
let entries=load("workEntries_v10",[]);
let cats=load("offCats_v1",null);if(!Array.isArray(cats)||!cats.length)cats=DEF_CATS.map(c=>({...c}));
let sel=new Set(),curM=new Date().getMonth(),curY=new Date().getFullYear(),sumM=curM,sumY=curY;
let formMode="work",tmode="total",editingId=null,payId=null,dayDate=null,reason=cats[0].name,charts=[],tab="list";
const pad=n=>String(n).padStart(2,"0");
const today=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const icon=r=>(cats.find(c=>c.name===r)||{}).emoji||"🗓️";
const fmtDay=s=>new Date(s+"T12:00").toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long"});
const money=n=>(Math.round(n*100)/100).toString().replace(".",",")+"€";
function ensureCats(){entries.forEach(e=>{if(e.type==="off"&&e.reason&&!cats.some(c=>c.name===e.reason))cats.push({name:e.reason,emoji:"🗓️"})})}
function save(){localStorage.setItem("workEntries_v10",JSON.stringify(entries));localStorage.setItem("offCats_v1",JSON.stringify(cats))}
function ic(){lucide.createIcons()}

// Tema
function initTheme(){const t=localStorage.getItem("theme");if(t==="dark"||(!t&&matchMedia("(prefers-color-scheme: dark)").matches))document.documentElement.classList.add("dark");themeIcon()}
function toggleDarkMode(){const d=document.documentElement.classList.toggle("dark");localStorage.setItem("theme",d?"dark":"light");themeIcon();if(tab==="sum")renderSummary()}
function themeIcon(){const i=$("theme-icon").parentElement;i.innerHTML=`<i id="theme-icon" data-lucide="${document.documentElement.classList.contains("dark")?"sun":"moon"}"></i>`;ic()}

function render(){save();renderStats();renderList();renderCalendar();updateBulk();
 $("locs").innerHTML=[...new Set(entries.filter(e=>e.type==="work"&&e.location).map(e=>e.location))].map(l=>`<option value="${esc(l)}">`).join("");ic()}

function renderStats(){let p=0,c=0;entries.forEach(e=>{if(e.type==="work"){const t=e.hours*e.rate;e.paid?c+=t:p+=t}});$("moneyPending").textContent=money(p);$("moneyPaid").textContent=money(c)}

function renderList(){
 const g={};entries.forEach(e=>(g[e.date]=g[e.date]||[]).push(e));
 const dates=Object.keys(g).sort().reverse();
 if(!dates.length){$("hist").innerHTML=`<div class="empty">Aún no hay registros.<br>Pulsa + para añadir el primero.</div>`;return}
 $("hist").innerHTML=dates.map(d=>`<div class="day"><h4>${fmtDay(d)}</h4>`+g[d].map(e=>{
  if(e.type==="off")return `<div class="card off e"><div class="grow big" style="font-size:.95rem">${icon(e.reason)} ${esc(e.reason)}</div>
   <button class="sm" onclick="editEntry('${e.id}')"><i data-lucide="pencil"></i></button><button class="sm del" onclick="deleteEntry('${e.id}')"><i data-lucide="trash-2"></i></button></div>`;
  const st=e.paid?`<span class="pill c">Cobrado${e.method==="cash"?" · 💵":e.method==="transfer"?" · 🏦":""}</span>`:`<span class="pill p">Pendiente</span>`;
  return `<div class="card e ${sel.has(e.id)?"sel":""}" onclick="toggleSelect('${e.id}')"><div class="grow">
   <div class="row sp"><span class="big">${e.hours}h${e.timeRange?`<span class="tm">${esc(e.timeRange)}</span>`:""}</span><span class="amt">${money(e.hours*e.rate)}</span></div>
   <div class="row sp" style="margin-top:3px"><span class="mut">${e.rate}€/h</span>${st}</div>
   ${e.location?`<span class="loc"><i data-lucide="map-pin"></i>${esc(e.location)}</span>`:""}</div>
   <div class="row" style="gap:0;flex-direction:column" onclick="event.stopPropagation()">
   <div class="row" style="gap:0"><button class="sm" onclick="editEntry('${e.id}')"><i data-lucide="pencil"></i></button>
   ${e.paid?`<button class="sm" onclick="togglePaid('${e.id}')"><i data-lucide="rotate-ccw"></i></button>`:`<button class="sm pay" onclick="openPay('${e.id}')"><i data-lucide="wallet"></i></button>`}
   <button class="sm del" onclick="deleteEntry('${e.id}')"><i data-lucide="trash-2"></i></button></div></div></div>`}).join("")+`</div>`).join("");
}

function renderCalendar(){
 $("monthLabel").textContent=new Date(curY,curM,1).toLocaleDateString("es-ES",{month:"long",year:"numeric"});
 const start=(new Date(curY,curM,1).getDay()+6)%7,n=new Date(curY,curM+1,0).getDate();let h="<div></div>".repeat(start);
 for(let d=1;d<=n;d++){const ds=`${curY}-${pad(curM+1)}-${pad(d)}`,it=entries.filter(e=>e.date===ds),w=it.filter(e=>e.type==="work");
  let cls="",sub="";
  if(w.length){cls=w.every(e=>e.paid)?"c":"p";sub=`<small>${w.reduce((s,e)=>s+e.hours,0)}h</small>`}
  else if(it.length){cls="o";sub=`<small style="font-size:.8rem">${icon(it[0].reason)}</small>`}
  h+=`<div class="cd ${cls} ${ds===today()?"today":""}" onclick="openDay('${ds}')">${d}${sub}</div>`}
 $("calDays").innerHTML=h}
function changeMonth(v){curM+=v;if(curM>11){curM=0;curY++}if(curM<0){curM=11;curY--}renderCalendar();ic()}

function switchTab(t){tab=t;["list","cal","sum"].forEach(x=>{$("v-"+x).classList.toggle("hidden",x!==t);$("t-"+x).classList.toggle("on",x===t)});
 $("fab").classList.toggle("hidden",t==="sum");if(t==="sum")renderSummary();ic();window.scrollTo(0,0)}

// Formulario
function setFormMode(m){formMode=m;$("f-work").classList.toggle("hidden",m!=="work");$("f-off").classList.toggle("hidden",m!=="off");$("m-work").classList.toggle("on",m==="work");$("m-off").classList.toggle("on",m==="off")}
function setTime(m){tmode=m;$("f-range").classList.toggle("hidden",m!=="range");$("hoursInput").classList.toggle("hidden",m!=="total");$("tm-total").classList.toggle("on",m==="total");$("tm-range").classList.toggle("on",m==="range")}
function calcHours(){const s=$("startTime").value,e=$("endTime").value;if(!s||!e)return 0;let d=(new Date("2000-01-01T"+e)-new Date("2000-01-01T"+s))/36e5;if(d<0)d+=24;$("calc").textContent=d.toFixed(2)+" horas";return d}
function renderChips(){if(!cats.some(c=>c.name===reason))reason=cats[0]?cats[0].name:"";
 $("chips").innerHTML=cats.map((c,i)=>`<button class="chip ${c.name===reason?"on":""}" onclick="reason=cats[${i}].name;renderChips()">${esc(c.emoji)} ${esc(c.name)}</button>`).join("")||`<span class="mut">Añade una categoría primero</span>`}
function openSheet(){$("sheet").classList.remove("hidden");if(!editingId){$("dateInput").value=$("dateInput").value||today()}renderChips();ic()}
function closeSheet(){$("sheet").classList.add("hidden");resetForm()}
function resetForm(){editingId=null;$("sheet-title").textContent="Nuevo registro";$("save-btn").textContent="Guardar registro";
 ["hoursInput","startTime","endTime","locationInput"].forEach(i=>$(i).value="");$("calc").textContent="0.00 horas";$("dateInput").value=today();setFormMode("work");setTime("total")}
function addEntry(){
 const date=$("dateInput").value;if(!date)return alert("Elige una fecha");let e={date};
 if(formMode==="work"){const hours=tmode==="total"?parseFloat($("hoursInput").value):calcHours();
  if(!(hours>0))return alert("Indica las horas trabajadas");
  e={...e,type:"work",location:$("locationInput").value.trim(),rate:parseFloat($("rateInput").value)||10,hours,
   timeRange:tmode==="range"?`${$("startTime").value} - ${$("endTime").value}`:null,paid:false,method:null}}
 else{if(!reason)return alert("Elige o crea una categoría");e={...e,type:"off",reason}}
 if(editingId){const i=entries.findIndex(x=>x.id===editingId);e.id=editingId;if(e.type==="work"&&entries[i].type==="work"){e.paid=entries[i].paid;e.method=entries[i].method}entries[i]=e}
 else{e.id=Date.now().toString();entries.push(e)}
 closeSheet();render()}
function editEntry(id){const e=entries.find(x=>x.id===id);if(!e)return;closeDay();editingId=id;openSheet();
 $("sheet-title").textContent="Editando registro";$("save-btn").textContent="Guardar cambios";$("dateInput").value=e.date;setFormMode(e.type);
 if(e.type==="work"){$("locationInput").value=e.location||"";$("rateInput").value=e.rate;
  if(e.timeRange){setTime("range");const[s,t]=e.timeRange.split(" - ");$("startTime").value=s;$("endTime").value=t;calcHours()}else{setTime("total");$("hoursInput").value=e.hours}}
 else{reason=e.reason;renderChips()}}
function deleteEntry(id){if(confirm("¿Eliminar este registro?")){entries=entries.filter(e=>e.id!==id);sel.delete(id);render()}}

// Cobros
function openPay(id){payId=id;$("pay").classList.remove("hidden")}function closePay(){$("pay").classList.add("hidden")}
function confirmPayment(m){const e=entries.find(x=>x.id===payId);if(e){e.paid=true;e.method=m}closePay();render()}
function togglePaid(id){const e=entries.find(x=>x.id===id);if(!e)return;e.paid=!e.paid;if(!e.paid)e.method=null;render()}
function toggleSelect(id){sel.has(id)?sel.delete(id):sel.add(id);renderList();updateBulk();ic()}
function markBulkPaid(m){sel.forEach(id=>{const e=entries.find(x=>x.id===id);if(e&&e.type==="work"&&!e.paid){e.paid=true;e.method=m}});sel.clear();render()}
function updateBulk(){$("bulk").classList.toggle("hidden",!sel.size);$("bulk-text").textContent=`${sel.size} seleccionados`}

// Día
function openDay(d){dayDate=d;$("day-title").textContent=fmtDay(d);const it=entries.filter(e=>e.date===d);
 $("day-content").innerHTML=it.map(e=>`<div class="card e" style="background:var(--bg);box-shadow:none"><div class="grow"><b>${e.type==="work"?e.hours+"h · "+money(e.hours*e.rate):icon(e.reason)+" "+esc(e.reason)}</b>${e.type==="work"&&e.location?`<div class="mut">${esc(e.location)}</div>`:""}</div><button class="sm" onclick="editEntry('${e.id}')"><i data-lucide="pencil"></i></button></div>`).join("")||`<div class="mut" style="text-align:center;margin-bottom:12px">Sin registros</div>`;
 $("day").classList.remove("hidden");ic()}
function closeDay(){$("day").classList.add("hidden")}
function newFromDay(){const d=dayDate;closeDay();resetForm();$("dateInput").value=d;openSheet()}

// Categorías
function openCats(){renderCats();$("cats").classList.remove("hidden");ic()}
function closeCats(){$("cats").classList.add("hidden");renderChips();render()}
function renderCats(){$("cat-list").innerHTML=cats.map((c,i)=>`<div class="cr"><input class="em" value="${esc(c.emoji)}" maxlength="4" onchange="editCat(${i},'emoji',this.value)"><input value="${esc(c.name)}" onchange="editCat(${i},'name',this.value)"><button class="sm del" onclick="delCat(${i})"><i data-lucide="trash-2"></i></button></div>`).join("")||`<div class="mut">No hay categorías.</div>`;ic()}
function editCat(i,f,v){v=v.trim();if(!v){renderCats();return}
 if(f==="name"){if(cats.some((c,j)=>j!==i&&c.name.toLowerCase()===v.toLowerCase())){alert("Ya existe una categoría con ese nombre");renderCats();return}
  const old=cats[i].name;entries.forEach(e=>{if(e.type==="off"&&e.reason===old)e.reason=v});if(reason===old)reason=v}
 cats[i][f]=v;save();renderCats()}
function delCat(i){const n=entries.filter(e=>e.type==="off"&&e.reason===cats[i].name).length;
 if(!confirm(n?`Hay ${n} días con "${cats[i].name}". Se conservarán en el historial con su nombre. ¿Eliminar la categoría?`:`¿Eliminar "${cats[i].name}"?`))return;
 cats.splice(i,1);save();renderCats()}
function addCat(){const n=$("newName").value.trim(),em=$("newEmoji").value.trim()||"🗓️";if(!n)return;
 if(cats.some(c=>c.name.toLowerCase()===n.toLowerCase()))return alert("Ya existe esa categoría");
 cats.push({name:n,emoji:em});$("newName").value="";$("newEmoji").value="";save();renderCats()}

// Resumen
function changeSummaryMonth(d){sumM+=d;if(sumM>11){sumM=0;sumY++}if(sumM<0){sumM=11;sumY--}renderSummary()}
function renderSummary(){
 $("sumLabel").textContent=new Date(sumY,sumM,1).toLocaleDateString("es-ES",{month:"long",year:"numeric"});
 const pre=`${sumY}-${pad(sumM+1)}`,me=entries.filter(e=>e.date.slice(0,7)===pre);
 const days=new Set(),off={};let h=0,t=0,cash=0,bank=0,pend=0;
 me.forEach(e=>{if(e.type==="work"){days.add(e.date);h+=e.hours;const a=e.hours*e.rate;t+=a;if(e.paid){e.method==="cash"?cash+=a:e.method==="transfer"?bank+=a:0}else pend+=a}else off[e.reason]=(off[e.reason]||0)+1});
 $("s-days").textContent=days.size;$("s-off").textContent=Object.values(off).reduce((a,b)=>a+b,0);$("s-hours").textContent=h.toFixed(1)+"h";$("s-total").textContent=money(t);
 $("s-cash").textContent=money(cash);$("s-bank").textContent=money(bank);$("s-pend").textContent=money(pend);
 $("s-reasons").innerHTML=Object.entries(off).map(([r,n])=>`${icon(r)} ${esc(r)}: ${n}`).join("<br>")||"—";
 charts.forEach(c=>c.destroy());Chart.defaults.color=getComputedStyle(document.body).color;
 const mk=(id,type,labels,data,colors)=>new Chart($(id),{type,data:{labels,datasets:[{data,backgroundColor:colors,borderWidth:0}]},options:{plugins:{legend:{position:"bottom"}}}});
 charts=[mk("moneyChart","doughnut",["Cobrado","Pendiente"],[cash+bank,pend],["#22c55e","#fb923c"]),mk("methodChart","doughnut",["Banco","Efectivo"],[bank,cash],["#3b82f6","#22c55e"])]}

// Exportar / importar
$("export-btn").addEventListener("click",()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(entries,null,2)],{type:"application/json"}));
 const a=document.createElement("a");a.href=url;a.download=`mi-jornada-${today()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)});
$("import-btn").addEventListener("click",()=>$("import-input").click());
function validarEntradas(d){if(!Array.isArray(d))return null;const re=/^\d{4}-\d{2}-\d{2}$/,out=[];
 for(const e of d){if(!e||typeof e!=="object"||typeof e.date!=="string"||!re.test(e.date))return null;if(e.type!=="work"&&e.type!=="off")return null;if(e.type==="work"&&!(Number(e.hours)>0))return null;
  out.push({...e,id:e.id?String(e.id):Date.now().toString()+out.length})}return out}
$("import-input").addEventListener("change",ev=>{const inp=ev.target,f=inp.files[0];if(!f)return;const r=new FileReader();
 r.onload=x=>{try{const v=validarEntradas(JSON.parse(x.target.result));if(!v)return alert("Archivo inválido ❌ No se ha cambiado nada.");
  if(!confirm(`Se van a reemplazar tus ${entries.length} registros actuales por ${v.length} del archivo. ¿Continuar?`))return;
  entries=v;ensureCats();render();alert("Datos importados correctamente ✅")}catch(err){alert("Error al leer el archivo ❌")}finally{inp.value=""}};r.readAsText(f)});

// Inicio
ensureCats();initTheme();$("dateInput").value=today();render();switchTab("list");
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js");
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
</script>
</body>
